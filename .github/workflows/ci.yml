name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, beta, "1.87"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-features

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: build runtime crates for no_std target
        run: |
          cargo build -p embark-format --no-default-features --features "alloc enc dec" --target thumbv7em-none-eabihf
          cargo build -p embark-codec  --no-default-features --features "alloc dec deflate lz4 snappy" --target thumbv7em-none-eabihf
          cargo build -p embark-crypt  --no-default-features --features "alloc dec" --target thumbv7em-none-eabihf
          cargo build -p embark        --no-default-features --features "alloc deflate lz4 snappy encryption metadata" --target thumbv7em-none-eabihf

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install python-snappy
      - run: sudo apt-get update && sudo apt-get install -y xz-utils
      # `--test snappy_interop` selects the whole integration-test binary by
      # target name; a plain `cargo test ... snappy_interop` filter would
      # instead match against test *function* names (here `our_snappy_is_standard`)
      # and silently run zero tests.
      - run: EMBARK_SNAPPY_INTEROP=1 cargo test -p embark-codec --features "enc dec snappy" --test snappy_interop
      # Same pitfall as above: `--test lzma_interop` selects the binary by
      # target name so both `ours_decodes_by_xz` and `xz_output_decodes_by_ours`
      # actually run, rather than matching (and silently skipping) by function name.
      - run: EMBARK_LZMA_INTEROP=1 cargo test -p embark-codec --features "enc dec lzma" --test lzma_interop

  os-matrix:
    # Cross-platform coverage for the stable leg only -- the toolchain
    # matrix above already covers stable/beta/MSRV on Linux, so this adds
    # the OS axis rather than the full toolchain x OS cross-product.
    # windows-latest matters in particular: the author develops on Windows
    # and embark-macros' folder walking touches CARGO_MANIFEST_DIR and path
    # separators directly.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-features

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

  feature-powerset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # The workspace has 11 feature flags, so the true powerset (2^11) is
      # too large to run on every PR. --depth 2 checks every single feature
      # and every pair together (179 combinations across the workspace),
      # which is where missing `dep:`/`?/<feature>` wiring almost always
      # shows up -- including the kind of `--no-default-features` breakage
      # that a plain `--all-features` build can't catch.
      # `clippy ... -- -D warnings` rather than `check`: a degenerate feature
      # combination usually still compiles and only warns, so a compile-only
      # sweep misses it. Running the lints across the powerset is what
      # catches an import or a module that is dead under some combination.
      - run: cargo hack clippy --workspace --feature-powerset --depth 2 -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
