name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, beta, "1.87"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-features

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: build runtime crates for no_std target
        run: |
          cargo build -p embark-format --no-default-features --features "alloc enc dec" --target thumbv7em-none-eabihf
          cargo build -p embark-codec  --no-default-features --features "alloc dec deflate lz4 snappy" --target thumbv7em-none-eabihf
          cargo build -p embark-crypt  --no-default-features --features "alloc dec" --target thumbv7em-none-eabihf
          cargo build -p embark        --no-default-features --features "alloc deflate lz4 snappy encryption metadata" --target thumbv7em-none-eabihf

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install python-snappy
      - run: sudo apt-get update && sudo apt-get install -y xz-utils
      # `--test snappy_interop` selects the whole integration-test binary by
      # target name; a plain `cargo test ... snappy_interop` filter would
      # instead match against test *function* names (here `our_snappy_is_standard`)
      # and silently run zero tests.
      - run: EMBARK_SNAPPY_INTEROP=1 cargo test -p embark-codec --features "enc dec snappy" --test snappy_interop
      # Same pitfall as above: `--test lzma_interop` selects the binary by
      # target name so both `ours_decodes_by_xz` and `xz_output_decodes_by_ours`
      # actually run, rather than matching (and silently skipping) by function name.
      - run: EMBARK_LZMA_INTEROP=1 cargo test -p embark-codec --features "enc dec lzma" --test lzma_interop
