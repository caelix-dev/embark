# Config for `cargo deny check` (advisories, licenses, bans, sources).
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Run locally with: cargo install cargo-deny --locked && cargo deny check

[graph]
all-features = true

[output]
feature-depth = 1

# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
ignore = [
    #"RUSTSEC-0000-0000",
]

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# embark itself is MIT-only (see LICENSE-MIT / the workspace `license` key).
# This allow-list is for the *dependency* tree, not embark's own code.
#
# Apache-2.0 is allowed for ONE dependency, and only reluctantly.
# `lzma-rust2` is Apache-2.0 with no MIT option. It is the LZMA encoder, so
# it is reachable only through the `enc` feature, which only the proc macro
# turns on: it runs on the build host and is never linked into a user's
# binary. embark's own crates stay MIT (see LICENSE-MIT), and the artifact
# embark distributes carries no Apache-2.0 code.
#
# This entry was removed once, deliberately, so that an Apache-only
# dependency would fail this check rather than slip in unnoticed. It did
# exactly that when lzma-rust2 was added. Putting it back is a decision, not
# an oversight -- if the policy is that no dependency may be Apache-2.0 at
# any tier, drop this line and revert the lzma encoder to the hand-written
# one.
allow = [
    "MIT",
    "Apache-2.0",
    # adler2 (miniz_oxide -> embark-codec): "0BSD OR MIT OR Apache-2.0"
    "0BSD",
    # unicode-ident (syn/proc-macro2 -> embark-macros):
    # "(MIT OR Apache-2.0) AND Unicode-3.0": the OR resolves to MIT, but
    # the AND means the Unicode-3.0 side must be allowed too.
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
wildcards = "deny"
workspace-default-features = "allow"
external-default-features = "allow"

# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
