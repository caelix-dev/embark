[package]
name = "embark-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Procedural macros for embark (build-time only)."
documentation = "https://docs.rs/embark-macros"
keywords = ["embark", "embed", "derive", "macros", "assets"]
categories = ["development-tools::build-utils"]
include = ["src/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
embark-format = { workspace = true, features = ["enc"] }
embark-codec = { workspace = true, features = ["enc"] }
embark-crypt = { workspace = true, features = ["enc"] }

[features]
# Mirror the codec features the consuming `embark` crate enables, so
# `compress_best` (and `codec = auto`) never picks a codec the consumer
# has no decoder compiled in for. See crates/embark/Cargo.toml, which
# forwards its own per-codec features to these via `embark-macros?/<codec>`.
deflate = ["embark-codec/deflate"]
lz4 = ["embark-codec/lz4"]
snappy = ["embark-codec/snappy"]
zstd = ["embark-codec/zstd"]
lzma = ["embark-codec/lzma"]
# Mirrors the codec features above: forwarded from the consuming `embark`
# crate via `embark-macros?/aes`, so `cipher = aes` is only accepted when
# `embark` itself has the AES-256-GCM decoder compiled in.
aes = ["embark-crypt/aes"]

[lints]
workspace = true
