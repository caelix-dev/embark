[package]
name = "embark-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Procedural macros for embark (build-time only)."

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
embark-format = { workspace = true, features = ["enc"] }
embark-codec = { workspace = true, features = ["enc", "deflate", "lz4", "snappy"] }
embark-crypt = { workspace = true, features = ["enc"] }
