[package]
name = "embark-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Unified compression codec layer for embark."

[dependencies]
embark-format.workspace = true
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"], optional = true }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "safe-encode"], optional = true }
# ruzstd is a pure-Rust, no_std+alloc zstd implementation. Default features
# ("hash", "std") are dropped: "hash" only gates the optional xxhash content
# checksum (we don't need it), and "std" would pull in std::io. Snappy is
# self-implemented (no dep).
ruzstd = { version = "0.9", default-features = false, optional = true }

[features]
default = []
std = []
alloc = ["embark-format/alloc"]
enc = ["alloc", "embark-format/enc"]
dec = ["alloc", "embark-format/dec"]
deflate = ["dep:miniz_oxide"]
lz4 = ["dep:lz4_flex"]
snappy = []
zstd = ["dep:ruzstd"]
lzma = []   # Phase 3
