[package]
name = "embark-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Unified compression codec layer for embark."
documentation = "https://docs.rs/embark-codec"
keywords = ["compression", "deflate", "lz4", "zstd", "snappy"]
categories = ["compression", "no-std"]
include = ["src/**/*.rs", "LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
embark-format.workspace = true
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"], optional = true }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "safe-encode"], optional = true }
# ruzstd is a pure-Rust, no_std+alloc zstd implementation. Default features
# ("hash", "std") are dropped: "hash" only gates the optional xxhash content
# checksum (we don't need it), and "std" would pull in std::io. Snappy is
# self-implemented (no dep).
ruzstd = { version = "0.9", default-features = false, optional = true }
# LZMA1 encoder, a port of tukaani's "xz for java". Only the encoder is taken:
# our own decoder is what ships in a user's binary, so this is a build-time
# dependency of the `enc` half and never reaches the `dec` path. Default
# features are all dropped -- "std" would pull in std::io, "optimization" is
# the crate's only unsafe code, and "lzip"/"xz" are container formats we do
# not emit (the latter would also drag in sha2).
lzma-rust2 = { version = "0.20.1", default-features = false, features = ["encoder"], optional = true }

[features]
default = []
std = []
alloc = ["embark-format/alloc"]
# Cargo cannot express "enable this dependency when `enc` and `lzma` are both
# on", so lzma-rust2 hangs off `enc`. That is the side to attach it to: `enc`
# is compiled for the host inside the proc macro, while `dec` is compiled for
# the consumer's target, which may be no_std.
enc = ["alloc", "embark-format/enc", "dep:lzma-rust2"]
dec = ["alloc", "embark-format/dec"]
deflate = ["dep:miniz_oxide"]
lz4 = ["dep:lz4_flex"]
snappy = []
zstd = ["dep:ruzstd"]
lzma = []
# Lets the build-time encoder use more than one thread. Compression happens
# in the proc macro on the build machine, so this never reaches a consumer's
# target: `embark-macros` turns it on for its own copy of this crate, and
# resolver 3 keeps that copy's features out of the target graph. Set
# `EMBARK_ENCODE_THREADS` to cap or disable it for one build.
parallel-encode = ["std"]

[lints]
workspace = true
