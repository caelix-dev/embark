[package]
name = "embark-crypt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
description = "ChaCha20-Poly1305 / AES-256-GCM AEAD wrapper for embark, with build-time key obfuscation."
documentation = "https://docs.rs/embark-crypt"
keywords = ["encryption", "aead", "chacha20", "aes-gcm", "embark"]
categories = ["cryptography", "no-std"]
include = ["src/**/*.rs", "LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
embark-format.workspace = true
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["alloc", "aes", "zeroize"], optional = true }
# Not named in the source: pulled in only to turn on `aes/zeroize`, which
# wipes the AES round-key schedule on drop. The first eight words of an
# AES-256 schedule are the key itself, and `aes-gcm` has no feature that
# forwards to it.
aes = { version = "0.8", default-features = false, features = ["zeroize"], optional = true }
getrandom = { version = "0.4", optional = true }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[features]
default = []
alloc = ["embark-format/alloc"]
enc = ["alloc", "embark-format/enc", "std", "dep:getrandom"]
dec = ["alloc", "embark-format/dec"]
std = []
aes = ["dep:aes-gcm", "dep:aes"]

[lints]
workspace = true
