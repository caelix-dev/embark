[package]
name = "embark-crypt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ChaCha20-Poly1305 AEAD wrapper for embark, with build-time key obfuscation."

[dependencies]
embark-format.workspace = true
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[features]
default = []
alloc = ["embark-format/alloc"]
enc = ["alloc", "embark-format/enc", "std"]
dec = ["alloc", "embark-format/dec"]
std = []
