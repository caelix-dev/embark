[package]
name = "embark"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Embed files into your binary with optional compression and encryption."
documentation = "https://docs.rs/embark"
keywords = ["embed", "assets", "compression", "encryption", "no-std"]
categories = ["compression", "cryptography", "development-tools::build-utils", "no-std"]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "examples/assets/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `alloc` and `dec` are not optional: every accessor on this crate's public
# API hands back a `Cow` or a `Vec`, so the decode path is always compiled.
embark-format = { workspace = true, features = ["alloc", "dec"] }
embark-codec = { workspace = true, features = ["alloc", "dec"] }
embark-crypt = { workspace = true, optional = true }
embark-macros = { workspace = true, optional = true }

[dev-dependencies]
embark-format = { workspace = true, features = ["enc"] }
embark-codec = { workspace = true, features = ["enc"] }
embark-crypt = { workspace = true, features = ["enc"] }
trybuild = "1.0"

[features]
default = ["std", "derive", "parallel-encode", "deflate"]
std = ["alloc", "embark-format/std"]
# No-op, kept so existing `default-features = false, features = ["alloc"]`
# manifests keep resolving. The crate always links `alloc`.
alloc = []
derive = ["dep:embark-macros"]
deflate = ["embark-codec/deflate", "embark-macros?/deflate"]
lz4 = ["embark-codec/lz4", "embark-macros?/lz4"]
snappy = ["embark-codec/snappy", "embark-macros?/snappy"]
zstd = ["embark-codec/zstd", "embark-macros?/zstd"]
lzma = ["embark-codec/lzma", "embark-macros?/lzma"]
encryption = ["dep:embark-crypt", "embark-crypt/dec"]
aes = ["encryption", "embark-crypt/aes", "embark-macros?/aes"]
metadata = []
# Build-time only: lets the macros compress with more than one thread. It is
# deliberately not forwarded to this crate's own `embark-codec`, which is the
# copy compiled for the consumer's target and holds only the decoder; nothing
# here adds a thread, or `std`, to a shipped binary. Set
# `EMBARK_ENCODE_THREADS=1` to turn it off for a build without editing a
# manifest.
parallel-encode = ["embark-macros?/parallel-encode"]

[[example]]
name = "single_file"
required-features = ["derive"]

[[example]]
name = "basic_derive"
required-features = ["derive"]

[[example]]
name = "compressed"
required-features = ["derive"]

[[example]]
name = "encrypted"
required-features = ["derive", "encryption"]

[lints]
workspace = true
