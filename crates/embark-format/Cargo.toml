[package]
name = "embark-format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Shared on-binary layout for the embark file-embedding toolkit."
documentation = "https://docs.rs/embark-format"
keywords = ["embark", "embed", "encoding", "binary", "no-std"]
categories = ["encoding", "no-std"]
include = ["src/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
enc = ["alloc"]
dec = ["alloc"]

[lints]
workspace = true
